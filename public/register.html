<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Eco Friendly Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #fff3e6 0%, #ffe0b3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(243, 146, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo p {
            color: #ff9933;
            font-size: 14px;
            margin-top: 10px;
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h2 {
            font-size: 22px;
            font-weight: 700;
            color: #c77400;
            margin-bottom: 5px;
        }

        .form-title p {
            color: #757575;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #f39200;
            font-weight: 600;
            font-size: 14px;
        }

        label .required {
            color: #d32f2f;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffe0b3;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
            background: #fffbf7;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #f39200;
            background: white;
            box-shadow: 0 0 0 3px rgba(243, 146, 0, 0.1);
        }

        input::placeholder {
            color: #9e9e9e;
        }

        .error-message {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        input.error,
        select.error {
            border-color: #d32f2f;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-left: 10px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 14px;
            font-weight: 400;
            color: #616161;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #f39200;
            text-decoration: none;
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f39200 0%, #e68500 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243, 146, 0, 0.3);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #e68500 0%, #c77400 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 146, 0, 0.4);
        }

        .submit-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .login-link {
            text-align: center;
            color: #757575;
            font-size: 14px;
            margin-top: 20px;
        }

        .login-link a {
            color: #f39200;
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 25px;
                border-radius: 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الشعار -->
        <div class="logo">
            <img src="Eco-friendy.svg" alt="Eco Friendy" style="width: 180px; height: auto; margin-bottom: 15px;">
            <p>تسوق بمسؤولية، احمِ كوكبنا</p>
        </div>

        <!-- عنوان النموذج -->
        <div class="form-title">
            <h2>إنشاء حساب جديد</h2>
            <p>املأ البيانات التالية للتسجيل</p>
        </div>

        <!-- نموذج التسجيل -->
        <form id="registerForm" onsubmit="handleSubmit(event)">
            <!-- الاسم الكامل -->
            <div class="form-group">
                <label for="fullname">الاسم الكامل <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="أدخل اسمك الكامل" required>
                <span class="error-message" id="fullname-error"></span>
            </div>

            <!-- اسم المستخدم -->
            <div class="form-group">
                <label for="username">اسم المستخدم <span class="required">*</span></label>
                <input type="text" id="username" name="username" placeholder="اختر اسم مستخدم فريد" required>
                <span class="error-message" id="username-error"></span>
            </div>

            <!-- البريد الإلكتروني -->
            <div class="form-group">
                <label for="email">البريد الإلكتروني <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <span class="error-message" id="email-error"></span>
            </div>

            <!-- رقم الهاتف -->
            <div class="form-group">
                <label for="phone">رقم الهاتف <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="07XXXXXXXX" required>
                <span class="error-message" id="phone-error"></span>
            </div>

            <!-- تاريخ الميلاد والجنس -->
            <div class="row">
                <div class="form-group">
                    <label for="birthdate">تاريخ الميلاد <span class="required">*</span></label>
                    <input type="date" id="birthdate" name="birthdate" required>
                    <span class="error-message" id="birthdate-error"></span>
                </div>

                <div class="form-group">
                    <label for="gender">الجنس <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">اختر...</option>
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                    <span class="error-message" id="gender-error"></span>
                </div>
            </div>

            <!-- الدولة -->
            <div class="form-group">
                <label for="country">الدولة <span class="required">*</span></label>
                <select id="country" name="country" required>
                    <option value="">اختر الدولة...</option>
                    <option value="JO">الأردن</option>
                    <option value="SA">السعودية</option>
                    <option value="AE">الإمارات</option>
                    <option value="EG">مصر</option>
                    <option value="IQ">العراق</option>
                    <option value="SY">سوريا</option>
                    <option value="LB">لبنان</option>
                    <option value="PS">فلسطين</option>
                    <option value="YE">اليمن</option>
                    <option value="KW">الكويت</option>
                    <option value="QA">قطر</option>
                    <option value="BH">البحرين</option>
                    <option value="OM">عمان</option>
                    <option value="MA">المغرب</option>
                    <option value="DZ">الجزائر</option>
                    <option value="TN">تونس</option>
                    <option value="LY">ليبيا</option>
                    <option value="SD">السودان</option>
                    <option value="other">أخرى</option>
                </select>
                <span class="error-message" id="country-error"></span>
            </div>

            <!-- كلمة المرور -->
            <div class="form-group">
                <label for="password">كلمة المرور <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة مرور قوية (8 أحرف على الأقل)" required>
                <span class="error-message" id="password-error"></span>
            </div>

            <!-- تأكيد كلمة المرور -->
            <div class="form-group">
                <label for="confirm-password">تأكيد كلمة المرور <span class="required">*</span></label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="أعد إدخال كلمة المرور" required>
                <span class="error-message" id="confirm-password-error"></span>
            </div>

            <!-- الموافقة على الشروط -->
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    أوافق على <a href="privacy.html">الشروط والأحكام</a> و <a href="privacy.html">سياسة الخصوصية</a>
                </label>
            </div>

            <!-- زر التسجيل -->
            <button type="submit" class="submit-btn" id="submitBtn">إنشاء حساب</button>
        </form>

        <!-- رابط تسجيل الدخول -->
        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">سجل دخولك</a>
        </div>
    </div>

    <script>
        console.log('✅ Script loaded');

        // معالجة إرسال النموذج
        async function handleSubmit(e) {
            e.preventDefault();
            console.log('🔄 Form submitted');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'جاري إنشاء الحساب...';
            submitBtn.disabled = true;

            // جمع البيانات
            const formData = {
                fullname: document.getElementById('fullname').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                birthdate: document.getElementById('birthdate').value,
                gender: document.getElementById('gender').value,
                country: document.getElementById('country').value,
                password: document.getElementById('password').value
            };

            console.log('📤 Sending data:', formData);

            try {
                const response = await fetch('api/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                console.log('📥 Response status:', response.status);

                const data = await response.json();
                console.log('📄 Response data:', data);

                if (data.success) {
                    // حفظ البريد الإلكتروني
                    localStorage.setItem('pending_verification_email', data.user.email);
                    
                    // رسالة نجاح
                    alert('✅ تم إنشاء حسابك بنجاح!\n\n📧 تم إرسال كود التفعيل إلى:\n' + data.user.email);
                    
                    // التوجيه لصفحة التفعيل
                    window.location.href = 'verify-email.html?email=' + encodeURIComponent(data.user.email);
                } else {
                    alert('❌ خطأ: ' + (data.message || 'حاول مرة أخرى'));
                    submitBtn.textContent = 'إنشاء حساب';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                alert('❌ حدث خطأ في الاتصال. حاول مرة أخرى!\n\nالخطأ: ' + error.message);
                submitBtn.textContent = 'إنشاء حساب';
                submitBtn.disabled = false;
            }
        }

        // اختبار عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Page loaded');
            const form = document.getElementById('registerForm');
            const btn = document.getElementById('submitBtn');
            console.log('Form element:', form);
            console.log('Button element:', btn);
            
            // اختبار الزر
            btn.addEventListener('click', function() {
                console.log('🖱️ Button clicked!');
            });
        });
    </script>
</body>
</html>
