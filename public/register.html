<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Eco Friendly Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --earth-green: #2d5016;
            --forest-dark: #1a3409;
            --leaf-bright: #7cb342;
            --sage-soft: #a8c090;
            --cream: #faf8f3;
            --clay: #d4a574;
            --moss: #5a6c3f;
            --bark: #4a3f35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, #e8f5e1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زخرفية عضوية */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 179, 66, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(45, 80, 22, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(168, 192, 144, 0.2) 0%, transparent 40%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .container {
            position: relative;
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 
                0 20px 60px rgba(45, 80, 22, 0.15),
                0 0 0 1px rgba(124, 179, 66, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* شعار نباتي */
        .logo {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
            animation: grow 0.6s ease-out 0.4s both;
        }

        @keyframes grow {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .logo h1 {
            font-family: 'Almarai', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--earth-green);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--moss);
            font-size: 14px;
            font-weight: 400;
        }

        .form-title {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .form-title h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--forest-dark);
            margin-bottom: 8px;
        }

        .form-title p {
            color: var(--moss);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 25px;
            animation: slideRight 0.6s ease-out both;
        }

        .form-group:nth-child(1) { animation-delay: 0.4s; }
        .form-group:nth-child(2) { animation-delay: 0.5s; }
        .form-group:nth-child(3) { animation-delay: 0.6s; }
        .form-group:nth-child(4) { animation-delay: 0.7s; }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--earth-green);
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e8d5;
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
            background: white;
            color: var(--forest-dark);
        }

        input:focus {
            outline: none;
            border-color: var(--leaf-bright);
            background: #f9fdf7;
            box-shadow: 0 0 0 4px rgba(124, 179, 66, 0.1);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #a8b89a;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--moss);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        input:focus + .input-icon {
            color: var(--leaf-bright);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--moss);
            padding: 5px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--leaf-bright);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.8s both;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-left: 10px;
            cursor: pointer;
            accent-color: var(--leaf-bright);
            transform: scale(1.2);
        }

        .checkbox-group label {
            margin: 0;
            font-size: 14px;
            font-weight: 400;
            color: var(--moss);
            cursor: pointer;
        }

        .checkbox-group a {
            color: var(--leaf-bright);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .checkbox-group a:hover {
            color: var(--earth-green);
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--leaf-bright) 0%, var(--earth-green) 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(124, 179, 66, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out 0.9s both;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .submit-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(124, 179, 66, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            animation: fadeIn 0.8s ease-out 1s both;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: linear-gradient(to right, transparent, #d0ddc4, transparent);
        }

        .divider::before { right: 55%; }
        .divider::after { left: 55%; }

        .divider span {
            background: white;
            padding: 0 15px;
            color: var(--moss);
            font-size: 14px;
            font-weight: 500;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 1.1s both;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e8d5;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: var(--leaf-bright);
            background: #f9fdf7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 179, 66, 0.2);
        }

        .login-link {
            text-align: center;
            color: var(--moss);
            font-size: 15px;
            animation: fadeIn 0.8s ease-out 1.2s both;
        }

        .login-link a {
            color: var(--leaf-bright);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--earth-green);
            text-decoration: underline;
        }

        /* زخرفة نباتية */
        .leaf-decoration {
            position: absolute;
            font-size: 80px;
            opacity: 0.08;
            pointer-events: none;
            animation: rotate 30s linear infinite;
        }

        .leaf-decoration.leaf-1 {
            top: -20px;
            right: -20px;
            animation-direction: reverse;
        }

        .leaf-decoration.leaf-2 {
            bottom: -30px;
            left: -30px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 40px 30px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .form-title h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- زخارف نباتية -->
        <div class="leaf-decoration leaf-1">🌿</div>
        <div class="leaf-decoration leaf-2">🍃</div>

        <!-- الشعار -->
        <div class="logo">
            <div class="logo-icon">🌱</div>
            <h1>Eco Friendly Store</h1>
            <p>تسوق بمسؤولية، احمِ كوكبنا</p>
        </div>

        <!-- عنوان النموذج -->
        <div class="form-title">
            <h2>انضم إلى عائلتنا الخضراء</h2>
            <p>ابدأ رحلتك نحو حياة مستدامة</p>
        </div>

        <!-- نموذج التسجيل -->
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">الاسم الكامل</label>
                <div class="input-wrapper">
                    <input type="text" id="fullname" name="fullname" placeholder="أدخل اسمك الكامل" required>
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    <span class="input-icon">✉️</span>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <div class="input-wrapper">
                    <input type="tel" id="phone" name="phone" placeholder="+962 7X XXX XXXX" required>
                    <span class="input-icon">📱</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة مرور قوية" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    أوافق على <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a>
                </label>
            </div>

            <button type="submit" class="submit-btn">إنشاء حساب 🌱</button>
        </form>

        <!-- فاصل -->
        <div class="divider">
            <span>أو سجل باستخدام</span>
        </div>

        <!-- تسجيل عبر وسائل التواصل -->
        <div class="social-login">
            <button class="social-btn" onclick="socialLogin('google')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>
            <button class="social-btn" onclick="socialLogin('facebook')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>
            <button class="social-btn" onclick="socialLogin('apple')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
            </button>
        </div>

        <!-- رابط تسجيل الدخول -->
        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">سجل دخولك</a>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Handle form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            
            // تغيير نص الزر أثناء الإرسال
            submitBtn.textContent = '⏳ جارِ إنشاء الحساب...';
            submitBtn.disabled = true;
            
            const formData = {
                fullname: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            try {
                // إرسال البيانات إلى السيرفر
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    alert('🎉 ' + data.message + '\n\nمرحباً بك ' + data.user.fullname);
                    // الانتقال للصفحة الرئيسية
                    window.location.href = '/';
                } else {
                    alert('❌ حدث خطأ: ' + (data.message || 'حاول مرة أخرى'));
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('خطأ:', error);
                alert('❌ حدث خطأ في الاتصال. تأكد من تشغيل السيرفر!');
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // Social login
        function socialLogin(provider) {
            console.log('تسجيل الدخول عبر:', provider);
            alert('جارِ الاتصال بـ ' + provider.toUpperCase() + '...');
            // هنا يمكنك إضافة كود OAuth للتسجيل عبر وسائل التواصل
        }

        // Phone number formatting
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.startsWith('962')) {
                value = value.substring(3);
            }
            if (value.startsWith('0')) {
                value = value.substring(1);
            }
            if (value.length > 0) {
                e.target.value = '+962 ' + value.substring(0, 9);
            }
        });
    </script>
</body>
</html>
