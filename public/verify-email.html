<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب - Eco Friendy</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #fff3e6 0%, #ffe0b3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(243, 146, 0, 0.2);
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #f39200;
            margin-bottom: 5px;
        }

        .logo p {
            color: #ff9933;
            font-size: 14px;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #c77400;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #757575;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .email-display {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 2px solid #4CAF50;
        }

        .email-display p {
            color: #2e7d32;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .email-display strong {
            color: #1b5e20;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #f39200;
            font-weight: 600;
            font-size: 15px;
        }

        .code-input-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            direction: ltr;
        }

        .code-input {
            width: 60px;
            height: 70px;
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            border: 3px solid #ffe0b3;
            border-radius: 12px;
            background: #fffbf7;
            transition: all 0.3s;
            font-family: monospace;
        }

        .code-input:focus {
            outline: none;
            border-color: #f39200;
            background: white;
            box-shadow: 0 0 0 3px rgba(243, 146, 0, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50 0%, #2e7d32 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(56, 142, 60, 0.3);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 142, 60, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .resend-section {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #ffe0b3;
        }

        .resend-text {
            color: #757575;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .resend-btn {
            background: white;
            color: #f39200;
            border: 2px solid #f39200;
        }

        .resend-btn:hover {
            background: #fff8f0;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #f39200;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #c77400;
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #4CAF50;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #3b82f6;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #ffe0b3;
            border-top: 4px solid #f39200;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .code-input {
                width: 50px;
                height: 60px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🌱 Eco Friendy</h1>
            <p>منتجات صديقة للبيئة</p>
        </div>

        <div class="icon">📧</div>
        
        <h2>تفعيل حسابك</h2>
        <p class="subtitle">أدخل كود التفعيل المكون من 6 أرقام الذي أرسلناه إلى بريدك الإلكتروني</p>

        <div id="email-display" class="email-display">
            <p>تم إرسال الكود إلى:</p>
            <strong id="user-email"></strong>
        </div>

        <div id="alert-container"></div>

        <form id="verification-form">
            <div class="form-group">
                <label>كود التفعيل (6 أرقام)</label>
                <div class="code-input-container">
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code1" required>
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code2" required>
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code3" required>
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code4" required>
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code5" required>
                    <input type="text" class="code-input" maxlength="1" pattern="[0-9]" inputmode="numeric" id="code6" required>
                </div>
            </div>

            <button type="submit" class="btn" id="verify-btn">
                ✅ تفعيل الحساب
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #757575;">جاري التحقق...</p>
        </div>

        <div class="resend-section">
            <p class="resend-text">لم تستلم الكود؟</p>
            <button class="btn resend-btn" id="resend-btn">
                📨 إعادة إرسال الكود
            </button>
        </div>

        <a href="login.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>

    <script>
        // ==================== المتغيرات ====================
        let userEmail = '';

        // ==================== عند تحميل الصفحة ====================
        window.addEventListener('DOMContentLoaded', () => {
            // الحصول على البريد الإلكتروني من URL أو localStorage
            const urlParams = new URLSearchParams(window.location.search);
            userEmail = urlParams.get('email') || localStorage.getItem('pending_verification_email');

            if (!userEmail) {
                showAlert('error', 'لم يتم العثور على البريد الإلكتروني. يرجى التسجيل أولاً.');
                setTimeout(() => {
                    window.location.href = 'register.html';
                }, 2000);
                return;
            }

            document.getElementById('user-email').textContent = userEmail;
            
            // التركيز على أول حقل
            document.getElementById('code1').focus();

            // إعداد حقول الكود
            setupCodeInputs();
        });

        // ==================== إعداد حقول الكود ====================
        function setupCodeInputs() {
            const inputs = document.querySelectorAll('.code-input');

            inputs.forEach((input, index) => {
                // الانتقال للحقل التالي عند الإدخال
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                // الرجوع للحقل السابق عند الحذف
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // السماح بالأرقام فقط
                input.addEventListener('keypress', (e) => {
                    if (!/[0-9]/.test(e.key)) {
                        e.preventDefault();
                    }
                });

                // منع اللصق في الحقول الفردية
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = e.clipboardData.getData('text');
                    if (/^\d{6}$/.test(pasteData)) {
                        pasteData.split('').forEach((digit, i) => {
                            if (inputs[i]) {
                                inputs[i].value = digit;
                            }
                        });
                        inputs[5].focus();
                    }
                });
            });
        }

        // ==================== التحقق من الكود ====================
        document.getElementById('verification-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // جمع الكود
            const code = Array.from(document.querySelectorAll('.code-input'))
                .map(input => input.value)
                .join('');

            if (code.length !== 6) {
                showAlert('error', 'يرجى إدخال كود التفعيل كاملاً');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('api/verify-email.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        code: code
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', data.message);
                    localStorage.removeItem('pending_verification_email');
                    
                    // الانتقال لصفحة تسجيل الدخول
                    setTimeout(() => {
                        window.location.href = 'login.html?verified=1';
                    }, 2000);
                } else {
                    showAlert('error', data.message);
                    // مسح الحقول
                    document.querySelectorAll('.code-input').forEach(input => input.value = '');
                    document.getElementById('code1').focus();
                }
            } catch (error) {
                console.error('خطأ:', error);
                showAlert('error', 'حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى');
            } finally {
                showLoading(false);
            }
        });

        // ==================== إعادة إرسال الكود ====================
        document.getElementById('resend-btn').addEventListener('click', async () => {
            const btn = document.getElementById('resend-btn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الإرسال...';

            try {
                const response = await fetch('api/resend-verification.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', 'تم إرسال كود جديد إلى بريدك الإلكتروني');
                } else {
                    showAlert('error', data.message);
                }
            } catch (error) {
                console.error('خطأ:', error);
                showAlert('error', 'حدث خطأ في إعادة الإرسال');
            } finally {
                btn.disabled = false;
                btn.textContent = '📨 إعادة إرسال الكود';
            }
        });

        // ==================== عرض التنبيهات ====================
        function showAlert(type, message) {
            const container = document.getElementById('alert-container');
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'error' ? 'alert-error' : 'alert-info';
            
            container.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;

            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // ==================== عرض التحميل ====================
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('verification-form').style.display = show ? 'none' : 'block';
            document.getElementById('verify-btn').disabled = show;
        }
    </script>
</body>
</html>
